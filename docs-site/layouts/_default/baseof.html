<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --sidebar-bg: #f6f8fa;
      --accent: #7c3aed;
      --code-bg: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #30363d;
        --sidebar-bg: #161b22;
        --accent: #a78bfa;
        --code-bg: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    .layout { display: flex; min-height: 100vh; }
    nav.sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    nav.sidebar .brand {
      display: block;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--fg);
      margin-bottom: 1.25rem;
    }
    nav.sidebar .brand span { color: var(--accent); }
    nav.sidebar ul { list-style: none; margin: 0; padding: 0; }
    nav.sidebar li a {
      display: block;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
    }
    nav.sidebar li a:hover { color: var(--fg); background: var(--border); }
    nav.sidebar li a.active { color: var(--accent); font-weight: 600; }
    main {
      flex: 1;
      min-width: 0;
      padding: 2.5rem 3rem;
      max-width: 860px;
    }
    main h1, main h2, main h3 { line-height: 1.3; }
    main h1 { margin-top: 0; }
    main h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin-top: 2.2rem; }
    main a { color: var(--accent); }
    main table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; }
    main th, main td { border: 1px solid var(--border); padding: 0.45rem 0.7rem; text-align: left; }
    main th { background: var(--sidebar-bg); }
    main code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.9em;
    }
    main pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
    main pre code { background: none; border: none; padding: 0; }
    main blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 1rem; color: var(--muted); }
    main hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      nav.sidebar { width: 100%; height: auto; position: static; }
      main { padding: 1.5rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <a class="brand" href="{{ "/" | relURL }}">🤖 <span>Slop Control</span> Docs</a>
      <ul>
        {{ $current := . }}
        {{ range .Site.RegularPages.ByTitle }}
        <li><a href="{{ .RelPermalink }}" {{ if eq . $current }}class="active"{{ end }}>{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </div>
</body>
</html>
